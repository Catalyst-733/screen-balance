# Publishes ScreenBalance.exe as a GitHub Release. Either:
#   - Actions tab > Release > Run workflow, and type the version (e.g. v1.0.1), or
#   - push a version tag: git tag v1.0.1 && git push origin v1.0.1
# The download link https://github.com/Catalyst-733/screen-balance/releases/latest/download/ScreenBalance.exe
# always points at the newest release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0.1 (creates that tag on the selected branch)"
        required: true
        default: "v1.0.0"

jobs:
  build:
    uses: ./.github/workflows/build-exe.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScreenBalance-exe

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then echo "Version must look like v1.0.1"; exit 1; fi
          gh release create "$TAG" ScreenBalance.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Screen Balance $TAG" \
            --notes "Download **ScreenBalance.exe** below and double-click it. No Python needed.

          Windows SmartScreen may warn about an unknown publisher the first time, because the exe isn't code-signed: click **More info → Run anyway**.

          Built from $GITHUB_SHA by the Release workflow."
